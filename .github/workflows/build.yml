name: Trochilidae build
on: [push, pull_request]
jobs:
  build:
    name: Trochilidae (PHP ${{ matrix.php-versions }})
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['7.4', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docs: https://github.com/shivammathur/setup-php
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: phpize
        run: phpize
      - name: configure
        run: ./configure --enable-trochilidae
      - name: make
        run: make
      - name: make test
        run: make test
      - name: Compile unit tests
        run: gcc -I. -DTROCHILIDAE_STANDALONE -DHAVE_CONFIG_H -D_GNU_SOURCE -g -O0 tests/unit_test.c trochilidae/tr_network.c trochilidae/utils.c -o tests/unit_test
      - name: Run unit tests
        run: ./tests/unit_test
      - name: Compile internal unit tests (tr_array, tr_timer)
        run: gcc -I. -DTROCHILIDAE_STANDALONE -DHAVE_CONFIG_H -g -O0 -Wall tests/tr_internal_test.c -o tests/tr_internal_test -lm
      - name: Run internal unit tests
        run: ./tests/tr_internal_test

  build-alpine:
    name: Trochilidae Alpine (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.5']

    container:
      image: php:${{ matrix.php-version }}-fpm-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: apk add --no-cache $PHPIZE_DEPS linux-headers

      - name: phpize
        run: phpize

      - name: configure
        run: ./configure --enable-trochilidae

      - name: make
        run: make -j"$(nproc)"

      - name: make test
        run: make test
      - name: Compile unit tests
        run: gcc -I. -DTROCHILIDAE_STANDALONE -DHAVE_CONFIG_H -D_GNU_SOURCE -g -O0 tests/unit_test.c trochilidae/tr_network.c trochilidae/utils.c -o tests/unit_test
      - name: Run unit tests
        run: ./tests/unit_test
      - name: Compile internal unit tests (tr_array, tr_timer)
        run: gcc -I. -DTROCHILIDAE_STANDALONE -DHAVE_CONFIG_H -g -O0 -Wall tests/tr_internal_test.c -o tests/tr_internal_test -lm
      - name: Run internal unit tests
        run: ./tests/tr_internal_test